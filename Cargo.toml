# Unified into root yolo-ui Cargo workspace
[package]
name = "rsrpc-examples"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
http = ["rsrpc/http", "dep:axum"]

[dependencies]
rsrpc.workspace = true
tokio.workspace = true
serde.workspace = true
anyhow.workspace = true
axum = { version = "0.7", optional = true }

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"

[[example]]
name = "http_demo"
path = "examples/http_demo.rs"
required-features = ["http"]

